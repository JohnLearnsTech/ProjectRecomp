# Builds the Android APK on GitHub's machines with the same Expo tooling and signing key, so
# installs carry over. Runs when started by hand (Actions > Android APK > Run workflow), or on a
# push whose commit message contains [apk]. The APK is attached to a GitHub release and kept as
# a workflow artifact.
name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, claude/android-auth-storage]

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[apk]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build the APK (preview profile, Expo's stored signing key)
        run: npx --yes eas-cli@latest build --platform android --profile preview --local --non-interactive --output "$GITHUB_WORKSPACE/recomp.apk"

      - name: Keep the APK as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: recomp-apk-${{ github.run_number }}
          path: recomp.apk

      - name: Publish a release with the APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Project Recomp build ${{ github.run_number }}
          body: Built from ${{ github.sha }}. Download recomp.apk below and open it on your phone to install.
          prerelease: true
          files: recomp.apk
